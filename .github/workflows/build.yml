name: Build Solution Images (BE + FE) – Cached Base

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag prefix (e.g. v1.5, latest, dev)'
        required: true
        default: 'latest'

jobs:
  # -------------------------------------------------
  # 1. Discover solutions → output a JSON **array**
  # -------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: solutions

      - id: set
        run: |
          cd solutions
          # Build JSON **array** → [ {"solution":"nepal","be":true,"fe":false}, ... ]
          items=$(find . -mindepth 1 -maxdepth 1 -type d | while read -r d; do
            folder=$(basename "$d")
            be=false; fe=false
            [ -f "$d/be-openimis.json" ] && be=true
            [ -f "$d/fe-openimis.json" ] && fe=true
            [[ $be == true || $fe == true ]] && \
              printf '{"solution":"%s","be":%s,"fe":%s},' "$folder" "$be" "$fe"
          done | sed 's/,$//')
          echo "matrix=[${items}]" >> $GITHUB_OUTPUT

  # -------------------------------------------------
  # 2. Build BASE images (once) – cached
  # -------------------------------------------------
  build-base:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        component: [be, fe]
    env:
      REPO: ${{ matrix.component == 'be' && 'openimis-be_py' || 'openimis-fe_js' }}
      BASE_TAG: ghcr.io/openimis/openimis-${{ matrix.component }}-base:${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: openimis/${{ env.REPO }}
          ref: develop
          path: base-repo

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push BASE image (cached)
        uses: docker/build-push-action@v5
        with:
          context: base-repo
          target: base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.BASE_TAG }}
          cache-from: type=gha,scope=base-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.component }}
          build-args: |
            OPENIMIS_CONF_JSON={}

      # Export tag using bash (no pipe in expression)
      - name: Export base tag
        run: |
          COMP=$(echo "${{ matrix.component }}" | tr '[:lower:]' '[:upper:]')
          echo "BASE_${COMP}_TAG=${{ env.BASE_TAG }}" >> $GITHUB_ENV

      # Also expose as job output (required for downstream job)
      - name: Set output
        id: out
        run: |
          COMP=$(echo "${{ matrix.component }}" | tr '[:lower:]' '[:upper:]')
          echo "tag=${{ env.BASE_TAG }}" >> $GITHUB_OUTPUT

    outputs:
      BASE_BE_TAG: ${{ steps.out.outputs.tag && steps.out.outputs.tag || '' }}
      BASE_FE_TAG: ${{ steps.out.outputs.tag && steps.out.outputs.tag || '' }}

  # -------------------------------------------------
  # 3. Build solution images – reuse base + JSON
  # -------------------------------------------------
  build-solution:
    needs: [discover, build-base]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}   # ← JSON **array**
    env:
      TAG_PREFIX: ${{ github.event.inputs.tag }}
      BASE_BE: ${{ needs.build-base.outputs.BASE_BE_TAG }}
      BASE_FE: ${{ needs.build-base.outputs.BASE_FE_TAG }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: solutions

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- BE ----------
      - name: Build BE image
        if: matrix.be
        uses: docker/build-push-action@v5
        with:
          context: solutions/${{ matrix.solution }}
          file: solutions/${{ matrix.solution }}/be-openimis.json   # core Dockerfile reads it
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/openimis/${{ env.TAG_PREFIX }}-${{ matrix.solution }}-be
          build-args: |
            OPENIMIS_CONF_JSON=$(cat solutions/${{ matrix.solution }}/be-openimis.json)
          cache-from: |
            type=gha,scope=base-be
            ${{ env.BASE_BE }}
          cache-to: type=gha,mode=max,scope=solution-${{ matrix.solution }}-be

      # ---------- FE ----------
      - name: Build FE image
        if: matrix.fe
        uses: docker/build-push-action@v5
        with:
          context: solutions/${{ matrix.solution }}
          file: solutions/${{ matrix.solution }}/fe-openimis.json
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/openimis/${{ env.TAG_PREFIX }}-${{ matrix.solution }}-fe
          build-args: |
            OPENIMIS_CONF_JSON=$(cat solutions/${{ matrix.solution }}/fe-openimis.json)
          cache-from: |
            type=gha,scope=base-fe
            ${{ env.BASE_FE }}
          cache-to: type=gha,mode=max,scope=solution-${{ matrix.solution }}-fe
