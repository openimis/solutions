name: Build Solution Images (BE + FE)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag prefix (e.g. v1.5, latest, dev)'
        required: true
        default: 'latest'

jobs:
  # -------------------------------------------------
  # 1. Checkout all repos + discover solutions
  # -------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout solutions repo
        uses: actions/checkout@v4
        with:
          path: solutions

      - name: Checkout openimis-be_py (develop)
        uses: actions/checkout@v4
        with:
          repository: openimis/openimis-be_py
          ref: develop
          path: openimis-be_py

      - name: Checkout openimis-fe_js (develop)
        uses: actions/checkout@v4
        with:
          repository: openimis/openimis-fe_js
          ref: develop
          path: openimis-fe_js

      - name: Discover solutions
        id: discover
        run: |
          cd solutions
          items=$(find . -mindepth 1 -maxdepth 1 -type d | while read -r d; do
            folder=$(basename "$d")
            be=false; fe=false
            [ -f "$d/be-openimis.json" ] && be=true
            [ -f "$d/fe-openimis.json" ] && fe=true
            [[ $be == true || $fe == true ]] && \
              printf '{"solution":"%s","be":%s,"fe":%s},' "$folder" "$be" "$fe"
          done | sed 's/,$//')
          echo "matrix=[${items}]" >> $GITHUB_OUTPUT

      - name: Upload source repos as artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-repos
          path: |
            openimis-be_py
            openimis-fe_js
            solutions

  # -------------------------------------------------
  # 2. Build BASE images (once) – cached
  # -------------------------------------------------
  build-base:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        component: [be, fe]
    env:
      SOURCE_DIR: ${{ matrix.component == 'be' && 'openimis-be_py' || 'openimis-fe_js' }}
      BASE_TAG: ghcr.io/openimis/openimis-${{ matrix.component }}-base:${{ github.event.inputs.tag }}
    steps:
      - name: Download source repos
        uses: actions/download-artifact@v4
        with:
          name: source-repos
          path: .

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push BASE image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SOURCE_DIR }}
          target: base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.BASE_TAG }}
          cache-from: type=gha,scope=base-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.component }}
          build-args: |
            OPENIMIS_CONF_JSON={}

      - name: Export base tag
        run: |
          COMP=$(echo "${{ matrix.component }}" | tr '[:lower:]' '[:upper:]')
          echo "BASE_${COMP}_TAG=${{ env.BASE_TAG }}" >> $GITHUB_ENV

      - name: Set output
        id: out
        run: |
          COMP=$(echo "${{ matrix.component }}" | tr '[:lower:]' '[:upper:]')
          echo "BASE_${COMP}_TAG=${{ env.BASE_TAG }}" >> $GITHUB_OUTPUT

    outputs:
      BASE_BE_TAG: ${{ steps.out.outputs.BASE_BE_TAG }}
      BASE_FE_TAG: ${{ steps.out.outputs.BASE_FE_TAG }}

  # -------------------------------------------------
  # 3. Build solution images – full copy + fixtures
  # -------------------------------------------------
  build-solution:
    needs: [prepare, build-base]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      TAG_PREFIX: ${{ github.event.inputs.tag }}
      BASE_BE: ${{ needs.build-base.outputs.BASE_BE_TAG }}
      BASE_FE: ${{ needs.build-base.outputs.BASE_FE_TAG }}

    steps:
      - name: Download source repos
        uses: actions/download-artifact@v4
        with:
          name: source-repos
          path: .

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------
      # Prepare BE build context
      # -------------------------------------------------
      - name: Prepare BE build context
        if: matrix.be
        run: |
          SOL="${{ matrix.solution }}"
          LOWER_SOL=$(echo "$SOL" | tr '[:upper:]' '[:lower:]')
          BUILD_DIR="build-be-$LOWER_SOL"
          mkdir -p "$BUILD_DIR"

          cp -r openimis-be_py/* "$BUILD_DIR/"
          cp "solutions/$SOL/be-openimis.json" "$BUILD_DIR/openimis.json"
          echo "BE openimis.json: $(cat $BUILD_DIR/openimis.json)" >> $GITHUB_OUTPUT
          [ -d "solutions/$SOL/fixtures" ] && cp -r "solutions/$SOL/fixtures" "$BUILD_DIR/fixtures/" || true

          echo "BUILD_DIR_BE=$BUILD_DIR" >> $GITHUB_ENV
          echo "LOWER_SOL=$LOWER_SOL" >> $GITHUB_ENV

      # -------------------------------------------------
      # Prepare FE build context
      # -------------------------------------------------
      - name: Prepare FE build context
        if: matrix.fe
        run: |
          SOL="${{ matrix.solution }}"
          LOWER_SOL=$(echo "$SOL" | tr '[:upper:]' '[:lower:]')
          BUILD_DIR="build-fe-$LOWER_SOL"
          mkdir -p "$BUILD_DIR"

          cp -r openimis-fe_js/* "$BUILD_DIR/"
          cp "solutions/$SOL/fe-openimis.json" "$BUILD_DIR/openimis.json"
          echo "FE openimis.json: $(cat $BUILD_DIR/openimis.json)" >> $GITHUB_OUTPUT

          echo "BUILD_DIR_FE=$BUILD_DIR" >> $GITHUB_ENV
          echo "LOWER_SOL=$LOWER_SOL" >> $GITHUB_ENV

      # -------------------------------------------------
      # Build BE
      # -------------------------------------------------
      - name: Build BE image
        if: matrix.be
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_DIR_BE }}
          file: ${{ env.BUILD_DIR_BE }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/openimis/${{ env.TAG_PREFIX }}-${{ env.LOWER_SOL }}-be
          #build-args: |
          #  OPENIMIS_CONF_JSON=$(jq -c . ${{ env.BUILD_DIR_BE }}/openimis.json)
          cache-from: |
            type=gha,scope=base-be
            ${{ env.BASE_BE }}
          cache-to: type=gha,mode=max,scope=solution-${{ env.LOWER_SOL }}-be

      # -------------------------------------------------
      # Build FE
      # -------------------------------------------------
      - name: Build FE image
        if: matrix.fe
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_DIR_FE }}
          file: ${{ env.BUILD_DIR_FE }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/openimis/${{ env.TAG_PREFIX }}-${{ env.LOWER_SOL }}-fe
          #build-args: |
          #  OPENIMIS_CONF_JSON=$(jq -c . ${{ env.BUILD_DIR_FE }}/openimis.json)
          cache-from: |
            type=gha,scope=base-fe
            ${{ env.BASE_FE }}
          cache-to: type=gha,mode=max,scope=solution-${{ env.LOWER_SOL }}-fe
