x-api:
  # BE_TAG must be the solution image (e.g. 26.10-shi) that bakes in be-openimis.json
  image: ghcr.io/openimis/openimis-be:${BE_TAG:-develop}
  environment: &ref_0
    - DB_DEFAULT=${DB_DEFAULT:-postgresql}
    - DB_HOST=${DB_HOST}
    - DB_PORT=${DB_PORT}
    - DB_NAME=${DB_NAME}
    - DB_USER=${DB_USER}
    - DB_PASSWORD=${DB_PASSWORD}
    - SECRET_KEY=${SECRET_KEY}
    - SITE_ROOT=api
    - SITE_URL=${DOMAIN}
    - CELERY_BROKER_URL=amqp://rabbitmq
    - MODE=${MODE:-Prod}
    - HOSTS=${HOSTS}
    - CACHE_BACKEND=${CACHE_BACKEND}
    - CACHE_URL=${CACHE_URL}
    - CACHE_OPTIONS=${CACHE_OPTIONS}
    - OPENSEARCH_ADMIN=${OPENSEARCH_ADMIN}
    - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
    - OPENSEARCH_HOSTS=${OPENSEARCH_HOSTS}
    - IMPERSONATION_ENABLED=true
    - EMAIL_HOST=${EMAIL_HOST}
    - EMAIL_PORT=${EMAIL_PORT}
    - EMAIL_BACKEND=${EMAIL_BACKEND}
  volumes: &ref_1
    - photos:/openimis-be/openIMIS/images/insurees
    - file_storage:/openimis-be/openIMIS/file_storage
  depends_on: &ref_2
    db:
      condition: service_healthy
  networks: &ref_3
    openimis-net: null
services:
  frontend:
    # FE_TAG must be the solution image (e.g. 26.10-shi) that bakes in fe-openimis.json
    image: ghcr.io/openimis/openimis-fe:${FE_TAG:-develop}
    restart: always
    environment:
      - REACT_APP_SENTRY_DSN=${REACT_APP_SENTRY_DSN}
      - REACT_APP_API_URL=api
      - NEW_OPENIMIS_HOST=${DOMAIN}
      - OPENIMIS_CONF_JSON=${OPENIMIS_FE_CONF_JSON}
      - OPENSEARCH_BASIC_TOKEN=${OPENSEARCH_BASIC_TOKEN}
    networks:
      openimis-net: null
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    depends_on:
      - backend
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - ./conf/nginx:/conf/
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=80
      - traefik.http.routers.frontend-http.entrypoints=web
      - traefik.http.routers.frontend-http.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
  migrations:
    image: ghcr.io/openimis/openimis-be:${BE_TAG:-develop}
    environment: *ref_0
    volumes: *ref_1
    depends_on: *ref_2
    networks: *ref_3
    command: init
    restart: 'no'
  backend:
    image: ghcr.io/openimis/openimis-be:${BE_TAG:-develop}
    environment: *ref_0
    volumes: *ref_1
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: *ref_3
    command: start
    restart: always
  worker:
    image: ghcr.io/openimis/openimis-be:${BE_TAG:-develop}
    environment: *ref_0
    volumes: *ref_1
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: *ref_3
    command: >-
      worker --concurrency=${CELERY_CONCURRENCY:-4}
      --max-tasks-per-child=${CELERY_MAX_TASK_PER_CHILD:-50} --loglevel=INFO
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery -A openIMIS inspect ping --timeout=10 --destination
          celery@$$HOSTNAME || exit 1
      interval: 25s
      timeout: 12s
      retries: 4
      start_period: 40s
    deploy:
      mode: replicated
      replicas: ${WORKER_REPLICAS:-3}
  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      openimis-net: null
networks:
  openimis-net:
    name: ${PROJECT_NAME:-openimis}-net
volumes:
  database: null
  photos: null
  file_storage: null
