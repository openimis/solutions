x-api:
  image: ghcr.io/openimis/openimis-be:${BE_TAG:-develop}
  environment: &ref_0
    - DB_DEFAULT=${DB_DEFAULT:-postgresql}
    - DB_HOST=${DB_HOST}
    - DB_PORT=${DB_PORT}
    - DB_NAME=${DB_NAME}
    - DB_USER=${DB_USER}
    - DB_PASSWORD=${DB_PASSWORD}
    - SECRET_KEY=${SECRET_KEY}
    - SITE_ROOT=api
    - SITE_URL=${DOMAIN}
    - CELERY_BROKER_URL=amqp://rabbitmq
    - MODE=${MODE:-Prod}
    - HOSTS=${HOSTS}
    - CACHE_BACKEND=${CACHE_BACKEND}
    - CACHE_URL=${CACHE_URL}
    - CACHE_OPTIONS=${CACHE_OPTIONS}
    - OPENSEARCH_ADMIN=${OPENSEARCH_ADMIN}
    - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
    - OPENSEARCH_HOSTS=${OPENSEARCH_HOSTS}
  volumes: &ref_1
    - photos:/openimis-be/openIMIS/images/insurees
  depends_on: &ref_2
    db:
      condition: service_healthy
  networks: &ref_3
    openimis-net: null
services:
  frontend:
    image: ghcr.io/openimis/openimis-fe:${FE_TAG:-develop}
    restart: always
    environment:
      - REACT_APP_API_URL=api
      - NEW_OPENIMIS_HOST=${DOMAIN}
      - OPENIMIS_CONF_JSON=${OPENIMIS_FE_CONF_JSON}
      - OPENSEARCH_BASIC_TOKEN=${OPENSEARCH_BASIC_TOKEN}
    networks:
      proxy: null
      openimis-net: null
    depends_on:
      - backend
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    labels:
      - traefik.enable=true
      - traefik.http.routers.${PROJECT_NAME}.rule=Host("${DOMAIN}")
      - traefik.http.routers.${PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${PROJECT_NAME}.tls=true
      - traefik.docker.network=proxy
      - traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=80
      - ./conf/nginx:/conf/
  migrations:
    image: ghcr.io/openimis/openimis-be:${BE_TAG:-develop}
    environment: *ref_0
    volumes: *ref_1
    depends_on: *ref_2
    networks: *ref_3
    command: init
    restart: 'no'
  backend:
    image: ghcr.io/openimis/openimis-be:${BE_TAG:-develop}
    environment: *ref_0
    volumes: *ref_1
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks: *ref_3
    command: start
    restart: always
  worker:
    image: ghcr.io/openimis/openimis-be:${BE_TAG:-develop}
    environment: *ref_0
    volumes: *ref_1
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks: *ref_3
    command: worker
    restart: always
    deploy:
      mode: replicated
      replicas: ${WORKER_REPLICAS:-3}
  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    networks:
      openimis-net: null
networks:
  openimis-net:
    name: ${PROJECT_NAME:-openimis}-net
  proxy:
    external: true
volumes:
  database: null
  photos: null
