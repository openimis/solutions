services:
  opensearch:
    image: public.ecr.aws/opensearchproject/opensearch:${OPENSEARCH_VERSION:-latest}
    env_file:
      - .env.openSearch
    environment:
      - discovery.type=${DISCOVERY_TYPE:-single-node}
      - cluster.name=${CLUSTER_NAME:-my_opensearch_local}
      - http.port=${OPEN_SEARCH_HTTP_PORT:-9200}
      - plugins.security.ssl.http.enabled=${SLL_HTTP_ENABLED:-false}
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:9200/_cluster/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
    networks:
      openimis-net: null
  opensearch-dashboards:
    image: >-
      public.ecr.aws/opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION:-latest}
    environment:
      - OPENSEARCH_HOSTS=${OPENSEARCH_HOSTS:-http://opensearch:9200}
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - SERVER_BASEPATH=/opensearch
      - SERVER_REWRITEBASEPATH=true
    volumes:
      - >-
        ./conf/opensearch/opensearch.yml:/usr/share/opensearch-dashboards/config/opensearch.yml
    networks:
      openimis-net: null
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - >-
        traefik.http.routers.opensearch.rule=Host(`${DOMAIN}`) &&
        PathPrefix(`/opensearch`)
      - traefik.http.routers.opensearch.entrypoints=websecure
      - traefik.http.routers.opensearch.tls=true
      - traefik.http.routers.opensearch.tls.certresolver=letsencrypt
      - traefik.http.services.opensearch.loadbalancer.server.port=5601
      - >-
        traefik.http.middlewares.opensearch-stripprefix.stripprefix.prefixes=/opensearch
      - >-
        traefik.http.middlewares.opensearch-auth.forwardauth.address=http://backend/${REACT_APP_API_URL}/core/users/current_user/
      - >-
        traefik.http.middlewares.opensearch-auth.forwardauth.authRequestHeaders=X-Original-URI,X-Real-IP,X-Forwarded-For,Authorization
      - >-
        traefik.http.middlewares.opensearch-auth.forwardauth.trustForwardHeader=true
      - >-
        traefik.http.middlewares.opensearch-basicauth.headers.customRequestHeaders.Authorization=Basic
        ${OPENSEARCH_BASIC_TOKEN}
      - >-
        traefik.http.routers.opensearch.middlewares=opensearch-auth,opensearch-basicauth,opensearch-stripprefix
      - >-
        traefik.http.routers.opensearch-http.rule=Host(`${DOMAIN}`) &&
        PathPrefix(`/opensearch`)
      - traefik.http.routers.opensearch-http.entrypoints=web
      - traefik.http.routers.opensearch-http.middlewares=redirect-to-https
volumes:
  opensearch-data1: null
